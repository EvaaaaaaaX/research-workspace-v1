<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Workspace V1 - MVP Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .active { background-color: #e5e7eb; font-weight: 600; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const mockResources = [
            { id: '1', title: 'Attention Is All You Need', type: 'FILE', source: 'arXiv', createdAt: '2026-06-20', tags: ['AI', 'Transformer'] },
            { id: '2', title: 'Next.js Documentation', type: 'URL', source: 'Next.js', createdAt: '2026-06-21', tags: ['Web', 'Docs'] },
            { id: '3', title: 'Research Ideas for V2', type: 'NOTE', source: 'Personal', createdAt: '2026-06-22', tags: ['Planning'] },
        ];

        const Sidebar = ({ currentView, setCurrentView }) => (
            <div className="w-64 bg-white border-r h-full flex flex-col">
                <div className="p-6 border-b flex items-center gap-2">
                    <div className="bg-blue-600 text-white p-1.5 rounded">
                        <i className="lucide-layers w-5 h-5"></i>
                    </div>
                    <span className="text-xl font-bold tracking-tight">Research WS</span>
                </div>
                <nav className="flex-1 p-4 space-y-2">
                    {[
                        { id: 'dashboard', label: 'Home', icon: 'lucide-home' },
                        { id: 'resources', label: 'Resources', icon: 'lucide-file-text' },
                        { id: 'collections', label: 'Collections', icon: 'lucide-layers' },
                        { id: 'tags', label: 'Tags', icon: 'lucide-hash' },
                    ].map(item => (
                        <button 
                            key={item.id}
                            onClick={() => setCurrentView(item.id)}
                            className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg sidebar-item ${currentView === item.id ? 'active' : 'text-gray-600'}`}
                        >
                            <i className={`${item.icon} w-4 h-4`}></i>
                            <span>{item.label}</span>
                        </button>
                    ))}
                </nav>
            </div>
        );

        const Dashboard = () => (
            <div className="space-y-8">
                <div className="flex justify-between items-center">
                    <div>
                        <h1 className="text-3xl font-bold">Dashboard</h1>
                        <p className="text-gray-500">Welcome to your Research Workspace.</p>
                    </div>
                    <button className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">
                        + New Resource
                    </button>
                </div>
                <div className="grid grid-cols-3 gap-6">
                    <div className="bg-white p-6 rounded-xl border shadow-sm">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-sm font-medium text-gray-500">Total Resources</span>
                            <i className="lucide-file-text text-gray-400"></i>
                        </div>
                        <div className="text-2xl font-bold">42</div>
                        <div className="text-xs text-gray-400">12 Files, 20 URLs, 10 Notes</div>
                    </div>
                    <div className="bg-white p-6 rounded-xl border shadow-sm">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-sm font-medium text-gray-500">Collections</span>
                            <i className="lucide-layers text-gray-400"></i>
                        </div>
                        <div className="text-2xl font-bold">5</div>
                        <div className="text-xs text-gray-400">Active projects</div>
                    </div>
                    <div className="bg-white p-6 rounded-xl border shadow-sm">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-sm font-medium text-gray-500">Tags</span>
                            <i className="lucide-hash text-gray-400"></i>
                        </div>
                        <div className="text-2xl font-bold">18</div>
                        <div className="text-xs text-gray-400">Unique descriptors</div>
                    </div>
                </div>
            </div>
        );

        const Resources = () => (
            <div className="space-y-6">
                <div className="flex justify-between items-center">
                    <h1 className="text-3xl font-bold">Resources</h1>
                    <button className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">
                        Add Resource
                    </button>
                </div>
                <div className="space-y-4">
                    {mockResources.map(res => (
                        <div key={res.id} className="bg-white p-4 rounded-lg border shadow-sm flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="bg-gray-100 p-2 rounded">
                                    <i className={`lucide-${res.type === 'FILE' ? 'file-text' : res.type === 'URL' ? 'link' : 'sticky-note'} text-blue-600`}></i>
                                </div>
                                <div>
                                    <h3 className="font-semibold">{res.title}</h3>
                                    <p className="text-sm text-gray-500">{res.type} • {res.source}</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {res.tags.map(tag => (
                                    <span key={tag} className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">#{tag}</span>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const App = () => {
            const [currentView, setCurrentView] = useState('dashboard');

            return (
                <div className="flex h-screen w-full">
                    <Sidebar currentView={currentView} setCurrentView={setCurrentView} />
                    <main className="flex-1 p-10 overflow-auto">
                        {currentView === 'dashboard' && <Dashboard />}
                        {currentView === 'resources' && <Resources />}
                        {currentView === 'collections' && <div className="p-10 text-center text-gray-500">Collections View (MVP)</div>}
                        {currentView === 'tags' && <div className="p-10 text-center text-gray-500">Tags View (MVP)</div>}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
